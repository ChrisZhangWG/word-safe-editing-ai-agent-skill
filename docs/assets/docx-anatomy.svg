<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Why DOCX editing is risky</title>
  <desc id="desc">A DOCX file is a package with document XML, relationships, media, styles, comments, fields, and tables. A visible text change can break hidden structure.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">A DOCX is not one page. It is a package.</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">The visible document depends on hidden XML parts staying connected.</text>

  <rect x="60" y="170" width="360" height="420" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="96" y="225" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">What the user sees</text>
  <rect x="105" y="265" width="270" height="34" rx="7" fill="#dbeafe"/>
  <rect x="105" y="320" width="210" height="24" rx="6" fill="#e5e7eb"/>
  <rect x="105" y="360" width="260" height="120" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="132" y="430" font-family="Arial, sans-serif" font-size="18" fill="#92400e">Figure / table / caption</text>
  <rect x="105" y="512" width="250" height="24" rx="6" fill="#e5e7eb"/>
  <text x="96" y="635" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Looks fine after a text edit</text>

  <path d="M455 370 C505 370 500 220 555 220" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M455 390 C515 390 505 520 555 520" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="560" y="145" width="560" height="490" rx="22" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#111827">What must still be valid</text>

  <g font-family="Arial, sans-serif" font-size="18" fill="#111827">
    <rect x="600" y="245" width="210" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="625" y="287">word/document.xml</text>
    <rect x="850" y="245" width="210" height="70" rx="12" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="892" y="287">relationships</text>

    <rect x="600" y="345" width="210" height="70" rx="12" fill="#dcfce7" stroke="#16a34a"/>
    <text x="670" y="387">media</text>
    <rect x="850" y="345" width="210" height="70" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="914" y="387">styles</text>

    <rect x="600" y="445" width="210" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="663" y="487">comments</text>
    <rect x="850" y="445" width="210" height="70" rx="12" fill="#e5e7eb" stroke="#475569"/>
    <text x="920" y="487">fields</text>
  </g>

  <path d="M810 280 H850" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M705 315 V345" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M955 315 V345" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M705 415 V445" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M955 415 V445" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="600" y="555" width="460" height="44" rx="10" fill="#111827"/>
  <text x="625" y="584" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Safety target: keep visible content and hidden links valid.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
