<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Checker coverage map</title>
  <desc id="desc">The checker can validate ZIP, XML, relationships, text requirements, image references, captions, and row height rules. Word and human review are still needed for layout, pagination, typography, and visual meaning.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">What the checker can and cannot prove</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">The script catches deterministic package problems. It does not replace Microsoft Word or human visual review.</text>

  <rect x="70" y="165" width="500" height="440" rx="20" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="110" y="220" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">Checker can test</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#111827">
    <text x="115" y="278">OK DOCX opens as a ZIP package</text>
    <text x="115" y="330">OK XML files are well-formed</text>
    <text x="115" y="382">OK relationship targets exist</text>
    <text x="115" y="434">OK required / forbidden text rules</text>
    <text x="115" y="486">OK unreferenced media warnings</text>
    <text x="115" y="538">OK selected caption or row-height rules</text>
  </g>

  <rect x="630" y="165" width="500" height="440" rx="20" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="670" y="220" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#991b1b">Still needs review</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#111827">
    <text x="675" y="278">Word opens and saves without repair</text>
    <text x="675" y="330">Pagination matches the source intent</text>
    <text x="675" y="382">Figures, captions, and tables look right</text>
    <text x="675" y="434">Fonts and spacing are visually acceptable</text>
    <text x="675" y="486">The edit is semantically correct</text>
    <text x="675" y="538">The user accepts the final document</text>
  </g>

  <rect x="250" y="635" width="700" height="48" rx="12" fill="#111827"/>
  <text x="300" y="666" font-family="Arial, sans-serif" font-size="19" fill="#ffffff">Rule: structural pass + Word verification + visual review before delivery.</text>
</svg>
