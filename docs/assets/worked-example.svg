<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">Worked example of a safe Word edit</title>
  <desc id="desc">A synthetic example shows how an agent removes an outdated figure while checking captions, image references, row height, Word verification, and rollback path.</desc>
  <rect width="1200" height="780" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Worked example: remove an outdated figure safely</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">The task is not finished when text changes. It is finished when surrounding structure still passes.</text>

  <g font-family="Arial, sans-serif">
    <rect x="60" y="160" width="250" height="180" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="90" y="205" font-size="24" font-weight="700" fill="#111827">1. Original</text>
    <rect x="100" y="230" width="170" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="123" y="265" font-size="17" fill="#92400e">Old Figure 3</text>
    <text x="90" y="318" font-size="16" fill="#475569">Caption and media link exist</text>

    <path d="M310 250 H370" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="370" y="160" width="250" height="180" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
    <text x="400" y="205" font-size="24" font-weight="700" fill="#111827">2. Risk</text>
    <text x="400" y="250" font-size="18" fill="#7f1d1d">Deleting the image alone</text>
    <text x="400" y="280" font-size="18" fill="#7f1d1d">may leave a stale caption,</text>
    <text x="400" y="310" font-size="18" fill="#7f1d1d">blank row, or broken link.</text>

    <path d="M620 250 H680" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="680" y="160" width="250" height="180" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <text x="710" y="205" font-size="24" font-weight="700" fill="#111827">3. Plan</text>
    <text x="710" y="250" font-size="18" fill="#1e3a8a">Use Full protection.</text>
    <text x="710" y="280" font-size="18" fill="#1e3a8a">Edit only Section 3.</text>
    <text x="710" y="310" font-size="18" fill="#1e3a8a">Keep a rollback copy.</text>

    <path d="M930 250 H990" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="990" y="160" width="150" height="180" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
    <text x="1020" y="205" font-size="24" font-weight="700" fill="#111827">4. Edit</text>
    <text x="1020" y="250" font-size="17" fill="#14532d">Remove</text>
    <text x="1020" y="278" font-size="17" fill="#14532d">figure and</text>
    <text x="1020" y="306" font-size="17" fill="#14532d">caption.</text>
  </g>

  <path d="M1065 340 V405" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <g font-family="Arial, sans-serif">
    <rect x="790" y="405" width="350" height="180" rx="18" fill="#ffffff" stroke="#9333ea" stroke-width="3"/>
    <text x="825" y="450" font-size="24" font-weight="700" fill="#111827">5. Checker gates</text>
    <text x="825" y="492" font-size="18" fill="#581c87">No old caption text</text>
    <text x="825" y="522" font-size="18" fill="#581c87">No broken image relationship</text>
    <text x="825" y="552" font-size="18" fill="#581c87">No suspicious blank row height</text>

    <path d="M790 495 H730" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="420" y="405" width="310" height="180" rx="18" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <text x="455" y="450" font-size="24" font-weight="700" fill="#111827">6. Word gate</text>
    <text x="455" y="492" font-size="18" fill="#075985">Open in Microsoft Word</text>
    <text x="455" y="522" font-size="18" fill="#075985">Save without repair warning</text>
    <text x="455" y="552" font-size="18" fill="#075985">Visual page review</text>

    <path d="M420 495 H360" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="60" y="405" width="300" height="180" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="95" y="450" font-size="24" font-weight="700" fill="#111827">7. Result</text>
    <rect x="95" y="485" width="100" height="42" rx="10" fill="#16a34a"/>
    <text x="119" y="512" font-size="18" fill="#ffffff">Deliver</text>
    <rect x="220" y="485" width="105" height="42" rx="10" fill="#dc2626"/>
    <text x="240" y="512" font-size="18" fill="#ffffff">Rollback</text>
    <text x="95" y="558" font-size="16" fill="#475569">One of these happens explicitly.</text>
  </g>

  <rect x="170" y="645" width="860" height="62" rx="14" fill="#111827"/>
  <text x="218" y="683" font-family="Arial, sans-serif" font-size="20" fill="#ffffff">Main idea: every risky edit gets a recovery path and concrete checks before delivery.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
