<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Ordinary AI edit versus Word Safe Editing AI Agent Skill</title>
  <desc id="desc">The ordinary flow edits and delivers quickly. The safe flow classifies risk, backs up, edits narrowly, checks structure, verifies in Word, then delivers or rolls back.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">What changes after installing the skill?</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">The agent stops treating a Word file like plain text and follows a recoverable editing sequence.</text>

  <rect x="60" y="160" width="500" height="500" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="95" y="215" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Ordinary agent flow</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#111827">
    <rect x="110" y="260" width="360" height="54" rx="12" fill="#e5e7eb"/>
    <text x="135" y="294">1. Open DOCX as content</text>
    <path d="M290 314 V350" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrowGray)"/>
    <rect x="110" y="350" width="360" height="54" rx="12" fill="#e5e7eb"/>
    <text x="135" y="384">2. Apply requested edit</text>
    <path d="M290 404 V440" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrowGray)"/>
    <rect x="110" y="440" width="360" height="54" rx="12" fill="#fee2e2" stroke="#dc2626"/>
    <text x="135" y="474">3. Deliver changed file</text>
  </g>
  <text x="110" y="560" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">Risk: hidden relationships, captions, fields, or layout may be broken.</text>

  <rect x="640" y="160" width="500" height="500" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="675" y="215" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">Skill-guided flow</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#111827">
    <rect x="690" y="250" width="360" height="46" rx="11" fill="#dbeafe" stroke="#2563eb"/>
    <text x="715" y="280">1. Classify edit risk</text>
    <path d="M870 296 V318" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="690" y="318" width="360" height="46" rx="11" fill="#dcfce7" stroke="#16a34a"/>
    <text x="715" y="348">2. Create recoverable backup</text>
    <path d="M870 364 V386" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="690" y="386" width="360" height="46" rx="11" fill="#fef9c3" stroke="#ca8a04"/>
    <text x="715" y="416">3. Edit only the needed area</text>
    <path d="M870 432 V454" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="690" y="454" width="360" height="46" rx="11" fill="#f3e8ff" stroke="#9333ea"/>
    <text x="715" y="484">4. Run structural DOCX checks</text>
    <path d="M870 500 V522" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <rect x="690" y="522" width="360" height="46" rx="11" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="715" y="552">5. Verify open/save in Word</text>
  </g>
  <rect x="690" y="605" width="165" height="42" rx="10" fill="#16a34a"/>
  <text x="726" y="633" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Deliver</text>
  <rect x="885" y="605" width="165" height="42" rx="10" fill="#dc2626"/>
  <text x="922" y="633" font-family="Arial, sans-serif" font-size="18" fill="#ffffff">Rollback</text>
  <path d="M870 568 C835 585 805 595 775 605" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <path d="M870 568 C910 585 940 595 965 605" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>

  <defs>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
