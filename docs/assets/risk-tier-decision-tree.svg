<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Risk tier decision tree</title>
  <desc id="desc">Decision tree for selecting Fast, Medium, or Full protection based on what the Word edit may disturb.</desc>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">Choose safety level by what the edit can disturb</text>
  <text x="60" y="112" font-family="Arial, sans-serif" font-size="19" fill="#4b5563">Small wording changes can still be high risk when they sit near Word structure.</text>

  <rect x="395" y="155" width="410" height="78" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="430" y="188" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Will the edit touch structured content?</text>
  <text x="430" y="216" font-family="Arial, sans-serif" font-size="16" fill="#475569">tables, images, captions, fields, comments, styles</text>

  <path d="M600 233 V285" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="395" y="285" width="410" height="78" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <text x="430" y="318" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Could pagination or layout change?</text>
  <text x="430" y="346" font-family="Arial, sans-serif" font-size="16" fill="#475569">page-end text, long rewrite, figure-adjacent text</text>

  <path d="M395 192 H220 V520" stroke="#dc2626" stroke-width="4" fill="none" marker-end="url(#arrowRed)"/>
  <text x="235" y="175" font-family="Arial, sans-serif" font-size="18" fill="#dc2626">yes</text>
  <path d="M805 194 H980 V520" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="930" y="175" font-family="Arial, sans-serif" font-size="18" fill="#16a34a">no</text>
  <path d="M395 324 H220" stroke="#f59e0b" stroke-width="4" fill="none" marker-end="url(#arrowAmber)"/>
  <text x="235" y="307" font-family="Arial, sans-serif" font-size="18" fill="#f59e0b">yes</text>
  <path d="M805 324 H980" stroke="#16a34a" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="930" y="307" font-family="Arial, sans-serif" font-size="18" fill="#16a34a">no</text>

  <rect x="95" y="520" width="250" height="150" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text x="140" y="565" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#991b1b">Full</text>
  <text x="125" y="605" font-family="Arial, sans-serif" font-size="17" fill="#7f1d1d">Use for structure-sensitive edits</text>
  <text x="125" y="635" font-family="Arial, sans-serif" font-size="16" fill="#7f1d1d">Example: remove a figure, caption,</text>
  <text x="125" y="658" font-family="Arial, sans-serif" font-size="16" fill="#7f1d1d">table row, field, or comment.</text>

  <rect x="475" y="520" width="250" height="150" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
  <text x="520" y="565" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#92400e">Medium</text>
  <text x="505" y="605" font-family="Arial, sans-serif" font-size="17" fill="#78350f">Use when layout may move</text>
  <text x="505" y="635" font-family="Arial, sans-serif" font-size="16" fill="#78350f">Example: rewrite a paragraph</text>
  <text x="505" y="658" font-family="Arial, sans-serif" font-size="16" fill="#78350f">at the end of a page.</text>

  <rect x="855" y="520" width="250" height="150" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text x="900" y="565" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#166534">Fast</text>
  <text x="885" y="605" font-family="Arial, sans-serif" font-size="17" fill="#14532d">Use for isolated text changes</text>
  <text x="885" y="635" font-family="Arial, sans-serif" font-size="16" fill="#14532d">Example: typo fix away from</text>
  <text x="885" y="658" font-family="Arial, sans-serif" font-size="16" fill="#14532d">tables, images, and fields.</text>

  <path d="M220 324 V520" stroke="#f59e0b" stroke-width="4" fill="none"/>
  <path d="M980 324 V520" stroke="#16a34a" stroke-width="4" fill="none"/>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#64748b"/></marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#dc2626"/></marker>
    <marker id="arrowAmber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#f59e0b"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M2 2 L10 6 L2 10 Z" fill="#16a34a"/></marker>
  </defs>
</svg>
