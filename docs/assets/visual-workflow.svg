<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img">
<title>Why and how Word Safe Editing works</title>
<rect width="1200" height="560" rx="32" fill="#08152f"/>
<text x="600" y="56" text-anchor="middle" fill="white" font-family="Arial" font-size="32" font-weight="bold">Direct editing vs. safety-first editing</text>
<g font-family="Arial">
<rect x="55" y="95" width="500" height="160" rx="22" fill="#351b2d" stroke="#fb7185" stroke-width="2"/>
<text x="305" y="135" text-anchor="middle" fill="#fda4af" font-size="25" font-weight="bold">Direct AI editing</text>
<text x="90" y="180" fill="white" font-size="20">Edit immediately → hidden damage → repair warning</text>
<text x="90" y="220" fill="#fecdd3" font-size="18">Little protection if the file breaks after delivery</text>
<rect x="645" y="95" width="500" height="160" rx="22" fill="#0b3038" stroke="#2dd4bf" stroke-width="2"/>
<text x="895" y="135" text-anchor="middle" fill="#5eead4" font-size="25" font-weight="bold">Word Safe Editing</text>
<text x="680" y="180" fill="white" font-size="20">Backup → narrow edit → validate → verify in Word</text>
<text x="680" y="220" fill="#d1fae5" font-size="18">Deliver when safe—or roll back when checks fail</text>
<text x="600" y="315" text-anchor="middle" fill="white" font-size="28" font-weight="bold">How it works</text>
<g fill="#102a56" stroke="#60a5fa" stroke-width="2">
<rect x="55" y="355" width="180" height="100" rx="18"/><rect x="280" y="355" width="180" height="100" rx="18"/><rect x="505" y="355" width="180" height="100" rx="18"/><rect x="730" y="355" width="180" height="100" rx="18"/><rect x="955" y="355" width="190" height="100" rx="18"/>
</g>
<g text-anchor="middle" fill="white" font-size="19" font-weight="bold"><text x="145" y="397">Assess risk</text><text x="145" y="427" fill="#93c5fd" font-size="15">Fast · Medium · Full</text><text x="370" y="412">Backup</text><text x="595" y="412">Narrow edit</text><text x="820" y="412">Validate DOCX</text><text x="1050" y="397">Word verification</text><text x="1050" y="427" fill="#86efac" font-size="15">Deliver ✓ / Roll back ↶</text></g>
<g fill="#60a5fa" font-size="32"><text x="245" y="417">→</text><text x="470" y="417">→</text><text x="695" y="417">→</text><text x="920" y="417">→</text></g>
</g>
</svg>
